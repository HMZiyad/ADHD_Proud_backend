version: '3.8'

services:
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis

  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=ecommerce
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  worker:
    build: .
    command: celery -A config worker -l info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - web
      - redis
      - db

  # ────────────────────────────────────────────────────────────────────────
  # Stripe CLI — forwards Stripe webhook events to the Django dev server
  # Run:  docker compose up stripe-cli
  # The CLI will print a webhook signing secret (whsec_...) on first run.
  # Copy that value into your .env as STRIPE_WEBHOOK_SECRET.
  # ────────────────────────────────────────────────────────────────────────
  stripe-cli:
    image: stripe/stripe-cli:latest
    command: >
      listen
      --api-key ${STRIPE_SECRET_KEY}
      --forward-to http://web:8000/api/orders/webhook/
      --skip-verify
    env_file:
      - .env
    depends_on:
      - web
    restart: unless-stopped

volumes:
  postgres_data:

